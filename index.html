<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Website QR Code</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <style>
        /* Center everything vertically and horizontally */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 0;
        }

        h2 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        #qrcode {
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }

        #qrcode:hover {
            transform: scale(1.05);
        }

        #qrcode img {
            width: 250px;
            height: 250px;
            display: block;
        }

        footer {
            margin-top: 30px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <h2>Scan this QR code to visit my website</h2>
    <div id="qrcode"></div>
    <footer>Or click the QR code to open the website</footer>

    <script>
        const websiteURL = 'https://vidyashreem46.github.io/profile-website/';
        const qrcodeDiv = document.getElementById('qrcode');

        // Generate QR code as an image
        QRCode.toDataURL(websiteURL)
        .then(url => {
            const img = document.createElement('img');
            img.src = url;
            img.alt = "QR code to my website";

            // Make QR code clickable
            img.style.cursor = "pointer";
            img.addEventListener('click', () => {
                window.open(websiteURL, "_blank");
            });

            qrcodeDiv.appendChild(img);
        })
        .catch(err => {
            console.error('Error generating QR code:', err);
        });
    </script>
</body>
</html>
